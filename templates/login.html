<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Sharvil's Cloud</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .logo {
      text-align: center;
      font-size: 36px;
      margin-bottom: 8px;
    }
    h2 {
      text-align: center;
      font-size: 20px;
      color: #2c2c2a;
      margin-bottom: 4px;
    }
    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #7f77dd; }
    button {
      width: 100%;
      padding: 12px;
      background: #3c3489;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #7f77dd; }
    .error {
      background: #fce8e8;
      color: #a32d2d;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
    }
    .hint {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">☁</div>
    <h2>Sharvil's Cloud Storage</h2>
    <p class="subtitle">Sign in to access your files</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter username" required autofocus/>
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter password" required/>
      <button type="submit">Sign In →</button>
    </form>

    <p class="hint">Only authorized users can access this storage.</p>
<p style="text-align:center; margin-top:14px; font-size:13px; color:#aaa">
  New user? <a href="/register" style="color:#3c3489; font-weight:600; text-decoration:none">Create Account</a>
</p>
  </div>
</body>
</html>
